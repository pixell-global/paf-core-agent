[project]
name = "paf-core-agent"
version = "0.1.0"
description = "PAF Core Agent - UPEE loop implementation for intelligent chat interactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core FastAPI and ASGI
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    # Pydantic for data validation
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-core==2.41.1",
    "pydantic-settings>=2.0.0",
    # HTTP client and async support
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
    # LLM Provider SDKs
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "boto3==1.38.27",
    "aioboto3==15.0.0",
    "jmespath==1.0.1",
    # Authentication and security
    "python-jose[cryptography]>=3.0.0",
    "passlib[bcrypt]>=1.7.0",
    "cryptography>=40.0.0",
    "pyjwt>=2.0.0",
    "email-validator>=2.0.0",
    # Monitoring and observability
    "prometheus-client>=0.15.0",
    "structlog>=23.0.0",
    "aws-xray-sdk>=2.10.0",
    # Additional utilities
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "tiktoken>=0.5.2",
    "aiomysql>=0.2.0",
    "pyyaml>=6.0.0",
    # A2A (Agent2Agent) Protocol SDK
    "a2a-sdk>=0.1.0",
    # LangChain
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    # Data processing
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    # Database
    "sqlalchemy>=2.0.43",
    "pixell-kit>=0.4.12",
    "grpcio>=1.76.0",
]

[project.optional-dependencies]
dev = [
    # Development and testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.10.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
